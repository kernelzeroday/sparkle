[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A beautiful terminal-first chat and prompt tool for language models"

[workspace.dependencies]
sparkle-core = { path = "crates/sparkle-core" }
sparkle-store = { path = "crates/sparkle-store" }
sparkle-tui = { path = "crates/sparkle-tui" }

anyhow = "1"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.3"
# The default reader can miss a keypress that arrives together with a resize.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
directories = "6"
libc = "0.2"
futures-util = "0.3"
mime_guess = "2"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
ratatui-textarea = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "net", "process"] }
toml = "1"
ulid = "3"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
